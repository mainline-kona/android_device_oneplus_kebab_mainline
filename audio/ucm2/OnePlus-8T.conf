Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/OnePlus-8T/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
	cset "name='ADC1 Volume' 10"
	cset "name='ADC2 Volume' 10"
	cset "name='ADC4 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
