Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/OnePlus-8T/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='Top Speaker Receiver Mode Switch' 0"
	cset "name='Top Speaker Playback Switch' 1"
	cset "name='Bottom Speaker Playback Switch' 1"
	cset "name='VA_DEC0 Volume' 108"
	cset "name='VA_DEC1 Volume' 108"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
