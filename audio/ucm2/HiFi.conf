SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo speakers"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Top Speaker Receiver Mode Switch' 0"
		cset "name='Top Speaker Playback Switch' 1"
		cset "name='Bottom Speaker Playback Switch' 1"
	]

	DisableSequence [
		cset "name='Top Speaker Playback Switch' 0"
		cset "name='Bottom Speaker Playback Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece receiver"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Bottom Speaker Playback Switch' 0"
		cset "name='Top Speaker Receiver Mode Switch' 1"
		cset "name='Top Speaker Playback Switch' 1"
	]

	DisableSequence [
		cset "name='Top Speaker Playback Switch' 0"
		cset "name='Top Speaker Receiver Mode Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Built-in digital microphones"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 108"
		cset "name='VA_DEC1 Volume' 108"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "VA_DEC0"
	}
}
